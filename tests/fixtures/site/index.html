<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网页视频港集成测试</title>
</head>
<body>
  <main>
    <h1>网页视频港集成测试</h1>
    <video id="direct-video" controls preload="metadata" src="/direct.mp4"></video>
    <video id="hls-video" controls preload="metadata">
      <source src="/master.m3u8" type="application/vnd.apple.mpegurl">
    </video>
  </main>
  <script>
    // Simulates the ordinary, extensionless video response used by some
    // WeChat-like CDNs. The extension should classify it from Content-Type.
    fetch('/wechat-stream?id=fixture', { headers: { Range: 'bytes=0-1023' } }).catch(() => {});
  </script>
</body>
</html>
